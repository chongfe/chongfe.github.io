name: 友链申请
description: 和 R1ck5 交换友链
title: "[友链] "
body:
  - type: input
    id: name
    attributes:
      label: 网站名称
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 网站地址
      placeholder: https://example.com/
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: 一句话介绍
    validations:
      required: true
  - type: input
    id: avatar
    attributes:
      label: 图标地址（可选）
  - type: textarea
    id: message
    attributes:
      label: 想说的话（可选）
